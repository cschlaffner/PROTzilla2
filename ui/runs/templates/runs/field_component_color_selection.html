<div class="checkbox-container border p-3 rounded">
    {% for option_value, option_label in choices %}
    <div class="d-flex" style="align-items: center">
        <div class="checkbox-item px-2 w-50">
            <input type="checkbox" id="{{ name }}_{{ option_label}}_checkbox" name="{{ name }}" value="{{ option_value }}">
            <label for="{{ name }}_{{ option_label}}_checkbox">{{ option_label }}</label>
        </div>
        <div class="ms-auto px-2 w-50">
            <select class="form-select" name="{{ name }}">
                {% for color, color_label in colors %}
                    <option value="color_{{ option_value }}_{{ color }}" {% if forloop.parentloop.counter0 == forloop.counter0 %}selected{% endif %}>
                        {{ color_label }}
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>
    {% endfor %}
</div>
